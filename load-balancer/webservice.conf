upstream books_v1 {
    zone books_v1 64k;
    resolver consul:8600 valid=5s ipv6=off;
    server service.consul service=book_service_v1 resolve;
}

upstream books_v2 {
    zone books_v2 64k;
    resolver consul:8600 valid=5s ipv6=off;
    server service.consul service=book_service_v2 resolve;
}

server {
    listen 80;

    add_header X-Backend $upstream_addr always;

    location /api/v1/books/ {
        proxy_pass http://books_v1/;
    }

    location /api/v2/books/ {
        proxy_pass http://books_v2/;
    }

    location / {
        return 404;
    }
}
