upstream videogames_v1 {
    zone videogames_v1 64k;
    resolver consul:8600 valid=5s ipv6=off;
    server service.consul service=videogame_service_v1 resolve;
}

upstream videogames_v2 {
    zone videogames_v2 64k;
    resolver consul:8600 valid=5s ipv6=off;
    server service.consul service=videogame_service_v2 resolve;
}

server {
    listen 80;

    add_header X-Backend $upstream_addr always;

    location /api/v1/videogames/ {
        proxy_pass http://videogames_v1/;
    }

    location /api/v2/videogames/ {
        proxy_pass http://videogames_v2/;
    }

    location / {
        return 404;
    }
}
