upstream movies_v1 {
    zone movies_v1 64k;
    resolver consul:8600 valid=5s ipv6=off;
    server service.consul service=movie_service_v1 resolve;
}

upstream movies_v2 {
    zone movies_v2 64k;
    resolver consul:8600 valid=5s ipv6=off;
    server service.consul service=movie_service_v2 resolve;
}

server {
    listen 80;

    add_header X-Backend $upstream_addr always;

    location /api/v1/movies/ {
        proxy_pass http://movies_v1/;
    }

    location /api/v2/movies/ {
        proxy_pass http://movies_v2/;
    }

    location / {
        return 404;
    }
}
